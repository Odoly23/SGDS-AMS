{% extends "base.html" %}
{% block title %}Masuk – LAFEX-AI{% endblock %}
{% block body %}
<main class="min-h-screen flex items-center justify-center p-4">
  <form method="post" class="w-full max-w-sm bg-white rounded-2xl shadow p-6 space-y-4">
    {% csrf_token %}
    <h1 class="text-2xl font-bold text-center">LAFEX-AI</h1>
    <p class="text-center text-sm text-slate-500">Masuk / Tama / Entrar / Sign in</p>
    {{ form.non_field_errors }}
    <div><label class="block text-sm mb-1">Username</label>
      <input name="username" required class="w-full border rounded-lg px-3 py-2" autofocus></div>
    <div><label class="block text-sm mb-1">Password</label>
      <input name="password" type="password" required class="w-full border rounded-lg px-3 py-2"></div>
    {% if form.errors %}<p class="text-sm text-red-600">Username atau password salah.</p>{% endif %}
    <button class="w-full bg-red-700 hover:bg-red-800 text-white rounded-lg py-2 font-medium">Masuk</button>
    <p class="text-sm text-center">Belum punya akun? <a class="text-red-700 underline" href="{% url 'signup' %}">Daftar</a></p>
  </form>
</main>
{% endblock %}
