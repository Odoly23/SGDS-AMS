{% extends "base.html" %}
{% block title %}Daftar – LAFEX-AI{% endblock %}
{% block body %}
<main class="min-h-screen flex items-center justify-center p-4">
  <form method="post" class="w-full max-w-sm bg-white rounded-2xl shadow p-6 space-y-3">
    {% csrf_token %}
    <h1 class="text-2xl font-bold text-center">Daftar akun</h1>
    {% for field in form %}
      <div>
        <label class="block text-sm mb-1">{{ field.label }}</label>
        <input name="{{ field.html_name }}" type="{% if 'password' in field.html_name %}password{% else %}text{% endif %}"
               class="w-full border rounded-lg px-3 py-2" required>
        {% for e in field.errors %}<p class="text-xs text-red-600">{{ e }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button class="w-full bg-red-700 hover:bg-red-800 text-white rounded-lg py-2 font-medium">Daftar</button>
    <p class="text-sm text-center"><a class="text-red-700 underline" href="{% url 'login' %}">Sudah punya akun? Masuk</a></p>
  </form>
</main>
{% endblock %}
