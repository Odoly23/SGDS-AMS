<svg xmlns="http://www.w3.org/2000/svg" width="48" height="64" viewBox="0 0 48 64" shape-rendering="crispEdges">
  <!-- Motif tais: merah, kuning, hitam, putih. Ubin 48x64 yang diulang ke samping. -->
  <rect width="48" height="64" fill="#C8201A"/>
  <!-- pita hitam bertitik kuning -->
  <rect width="48" height="8" fill="#1B1411"/>
  <rect x="4" y="3" width="3" height="3" fill="#FFC72C"/><rect x="16" y="3" width="3" height="3" fill="#FFC72C"/>
  <rect x="28" y="3" width="3" height="3" fill="#FFC72C"/><rect x="40" y="3" width="3" height="3" fill="#FFC72C"/>
  <rect y="8" width="48" height="2" fill="#FFFFFF"/>
  <!-- rantai belah ketupat -->
  <polygon points="24,12 37,22 24,32 11,22" fill="#FFC72C"/>
  <polygon points="24,16 32,22 24,28 16,22" fill="#1B1411"/>
  <rect x="22" y="20" width="4" height="4" fill="#FFFFFF"/>
  <rect x="0" y="20" width="2" height="4" fill="#FFFFFF"/><rect x="46" y="20" width="2" height="4" fill="#FFFFFF"/>
  <rect y="34" width="48" height="2" fill="#FFFFFF"/>
  <!-- pita hitam bergerigi (zigzag) -->
  <rect y="36" width="48" height="14" fill="#1B1411"/>
  <polyline points="0,46 12,39 24,46 36,39 48,46" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <polyline points="0,49 12,42 24,49 36,42 48,49" fill="none" stroke="#FFC72C" stroke-width="2"/>
  <rect y="50" width="48" height="2" fill="#FFFFFF"/>
  <!-- deret kotak kecil -->
  <rect x="2" y="56" width="4" height="4" fill="#FFC72C"/><rect x="10" y="56" width="4" height="4" fill="#FFC72C"/>
  <rect x="18" y="56" width="4" height="4" fill="#FFC72C"/><rect x="26" y="56" width="4" height="4" fill="#FFC72C"/>
  <rect x="34" y="56" width="4" height="4" fill="#FFC72C"/><rect x="42" y="56" width="4" height="4" fill="#FFC72C"/>
  <rect x="6" y="57" width="2" height="2" fill="#1B1411"/><rect x="14" y="57" width="2" height="2" fill="#1B1411"/>
  <rect x="22" y="57" width="2" height="2" fill="#1B1411"/><rect x="30" y="57" width="2" height="2" fill="#1B1411"/>
  <rect x="38" y="57" width="2" height="2" fill="#1B1411"/><rect x="46" y="57" width="2" height="2" fill="#1B1411"/>
</svg>
